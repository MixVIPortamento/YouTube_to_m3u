name: M3U generator

on:
  schedule:
    - cron: '0 0/3 * * *'

  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m3u-generator
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # yt-dlp needs a JS runtime to solve YouTube's player challenge.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Optional: add a YOUTUBE_COOKIES repo secret (Netscape cookies.txt export)
      # and/or YTDLP_PROXY if YouTube bot-blocks the Actions runner IP.
      - name: Write cookies file
        env:
          COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$COOKIES" ]; then
            printf '%s' "$COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "YOUTUBE_COOKIES=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
          fi

      # autorun.sh reinstalls requirements.txt on every run, so yt-dlp always
      # picks up its latest YouTube fixes. It exits non-zero when nothing
      # resolved (usually expired cookies), which fails the run instead of
      # committing a playlist full of placeholders.
      - name: Generate playlist
        env:
          YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
        run: |
          chmod +x autorun.sh
          ./autorun.sh 2> generator.log || STATUS=$?
          tail -40 generator.log
          {
            echo "### M3U generator"
            grep '^# resolved' generator.log || echo 'no channels resolved'
          } >> "$GITHUB_STEP_SUMMARY"
          exit ${STATUS:-0}

      - name: Commit & push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add youtube.m3u
          rm -f generator.log
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "links are updated"
          git push origin HEAD:${GITHUB_REF_NAME}
