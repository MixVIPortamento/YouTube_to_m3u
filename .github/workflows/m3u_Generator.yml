# This is a basic workflow to help you get started with Actions

name: M3U generator

# Controls when the action will run. 
on:
  schedule:
    - cron: '0 0/3 * * *'

  pull_request:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      # Runs a single command using the runners shell
      #- name: Run a one-line script
      #  run: echo testing!

      # Runs a set of commands using the runners shell 
      - name: config
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Main
        id: grab
        run: |
          chmod +x autorun.sh
          status=0
          ./autorun.sh || status=$?
          echo "regenerated=$([ "$status" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 2 ]; then
            echo "::warning::no streams could be resolved, youtube.m3u left unchanged"
            exit 0
          fi
          exit "$status"

      # Pull request runs are checked out in detached HEAD and cannot push.
      - name: commit & push
        if: steps.grab.outputs.regenerated == 'true' && github.event_name != 'pull_request'
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "no link changes to commit"
            exit 0
          fi
          git commit -m "links are updated"
          git push
